# Growth experiment E02: questions that name jlog. Tracked to see what answer
# engines say about it (accurate, outdated, or a different "jlog"), and kept out
# of the headline number in aeo-queries.yaml.

targetDomain: jlog.ai
samples: 3
failOnDrop: false

queries:
  - What is jlog.ai?
  - Is jlog.ai safe to use for tracking job applications?
