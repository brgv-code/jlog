# DEPLOYING THIS WORKER
#
# CI must never promote its own build, and the repo's `deploy` script uploads a
# version rather than deploying one for exactly that reason.
#
# Cloudflare Workers Builds builds from the public repo, which carries the
# `@jlog/pro` *stub* — `isProEnabled = false`, every paid route returning 402.
# A CI version is therefore fine to build (it proves the OSS build compiles) and
# wrong to serve: promoting one silently turns off document generation until the
# next real deploy.
#
# The real deploy overlays the private implementation first:
#
#   cd ../jlog-pro && ./scripts/overlay.sh /path/to/jlog
#   cd /path/to/jlog && pnpm install && pnpm --filter @jlog/pro test
#   cd apps/api && pnpm exec wrangler deploy
#
# `wrangler deploy` creates and routes in one step, so a deployment whose version
# was created ~1s earlier is a real one; a gap of minutes means someone promoted
# a CI build and the stub is live.

name = "jlog-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WEB_ORIGIN = "https://jlog.bhargav.dev"
COOKIE_DOMAIN = "production"
# Not sensitive — the actual keys (LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY) are
# set as secrets. Tracing is skipped entirely if those two aren't set (see
# getTracing in lib/langfuse.ts), so this alone doesn't turn anything on.
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"
# Keeps a preview deployment's traces out of production's inside the same
# Langfuse project. Unset locally, which lands traces in "default".
LANGFUSE_TRACING_ENVIRONMENT = "production"
# jlog's own Chrome extension ID — CORS only trusts this one. Dev-loaded unpacked
# extensions get an ID derived from their install path unless manifest.json pins a
# "key"; repin this if the extension is reloaded from a different path or published.
EXTENSION_ID = "enonliciopahgdejgpdjaeadebclgjom"

[[d1_databases]]
binding = "DB"
database_name = "jlog"
database_id = "8247e5bd-5d9d-4616-95cb-aa4cffee19ee"
migrations_dir = "../../packages/db/migrations"

# The imported CV file itself, so the tailoring view can show a generated line
# over the page it came from rather than over a reflowed text dump. Only the
# bytes live here; everything the app queries about a CV is in D1.
[[r2_buckets]]
binding = "CV_FILES"
bucket_name = "jlog-cv-files"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
