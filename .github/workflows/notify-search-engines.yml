name: Notify search engines

# Once a day: compare the live sitemap with the last run's snapshot, then
# resubmit the sitemap to Google Search Console and send the new or changed
# URLs to IndexNow. The work is in apps/web/scripts/notify-search-engines.mjs.
#
# Why at all: Google read the sitemap on 29 Oct 2026, the comparison and answer
# pages shipped on 31 Oct, and Search Console kept showing the old 26 URLs until
# the sitemap was resubmitted by hand.
#
# Why daily and not on every push: three merges touching one page would send
# that URL three times and resubmit the sitemap three times. IndexNow asks sites
# not to resend a URL many times a day, and Google says repeat requests do not
# get anything crawled faster. A daily run also needs no wait for the deploy:
# whatever the sitemap says at that moment is what is live.
#
# Setup, once (each part is skipped with a notice until it is done):
#   Environment `search-engines`, deployment branches limited to main, with
#     secret   GSC_SERVICE_ACCOUNT  JSON key of a service account that is a Full
#                                   user on the Search Console property, in a
#                                   Google Cloud project with the Search Console
#                                   API enabled
#     variable GSC_PROPERTY         the property exactly as Search Console names
#                                   it: `sc-domain:jlog.ai` or `https://jlog.ai/`
#     secret   INDEXNOW_KEY         any 32 hex characters
#   Cloudflare Pages project: the same INDEXNOW_KEY as an environment variable,
#   so the site serves /<key>.txt (src/pages/[indexnow].txt.ts).

on:
  schedule:
    - cron: '23 6 * * *'
  # Ignores the snapshot when asked, for a first run or after pages changed in
  # a way their lastmod does not show.
  workflow_dispatch:
    inputs:
      send_all:
        description: 'Send every URL in the sitemap, not only changed ones'
        type: boolean
        default: false

concurrency:
  group: notify-search-engines
  cancel-in-progress: false

jobs:
  notify:
    name: Resubmit sitemap and send changed URLs
    # A fork has none of these secrets and no site of its own to announce.
    if: github.repository == 'brgv-code/jlog'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    # Not `production`: that one needs an approval per run, which would hold
    # every daily run for a click. This job installs nothing (the script uses
    # Node built-ins only), so the dependency risk that approval guards against
    # does not reach these secrets. The environment's branch policy still keeps
    # them away from anything but main.
    environment: search-engines

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: apps/web/scripts/notify-search-engines.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The newest snapshot from any earlier run. Cache keys cannot be
      # overwritten, hence one per run; a missing cache means send everything.
      - name: Restore the last snapshot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .notify-snapshot.json
          key: notify-snapshot-${{ github.run_id }}
          restore-keys: notify-snapshot-

      - name: Notify
        env:
          SITE_URL: https://jlog.ai
          SNAPSHOT: .notify-snapshot.json
          SEND_ALL: ${{ inputs.send_all && '1' || '' }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node apps/web/scripts/notify-search-engines.mjs

      - name: Save the snapshot
        if: success() && hashFiles('.notify-snapshot.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .notify-snapshot.json
          key: notify-snapshot-${{ github.run_id }}
