name: AEO baseline

# Growth experiment E02: who answer engines (Perplexity, and ChatGPT when its key
# is set) cite for the questions jlog should answer, and whether any of it is
# jlog.ai. The questions are growth/aeo-queries.yaml; the numbers land in this
# run's summary and as JSON artifacts.
#
# Uses open-aeo (github.com/open-aeo/open-aeo) built from a pinned commit: the
# `check` command is not in the npm release yet.
#
# Weekly rather than fortnightly because the history that makes the trend
# column work is kept in the Actions cache, and GitHub evicts a cache entry
# nobody has touched for seven days.
#
# Needs repository secrets PERPLEXITY_API_KEY and, optionally, OPENAI_API_KEY.
# Without the first it does nothing and says so. A run is 14 questions x 3
# samples per engine.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aeo-baseline
  cancel-in-progress: false

jobs:
  check:
    name: Who answer engines cite
    runs-on: ubuntu-latest
    env:
      OPEN_AEO_REF: 2423657b4cd44358dc358b62120e58c2abdfb5bb
      OPEN_AEO_STORE_PATH: ${{ github.workspace }}/.open-aeo/history.json
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Stop here without a Perplexity key
        id: keys
        run: |
          if [ -z "$PERPLEXITY_API_KEY" ]; then
            echo "::notice::PERPLEXITY_API_KEY is not set as a repository secret, so nothing was checked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'

      - name: Check out open-aeo
        if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: open-aeo/open-aeo
          ref: ${{ env.OPEN_AEO_REF }}
          path: .open-aeo-src

      - uses: pnpm/action-setup@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Build open-aeo
        if: steps.keys.outputs.ready == 'true'
        working-directory: .open-aeo-src
        run: pnpm install --frozen-lockfile && pnpm build

      # The run id makes every run save a fresh entry; restore-keys picks up the
      # newest earlier one, which is what the trend column compares against.
      - name: Restore earlier runs
        if: steps.keys.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: .open-aeo
          key: open-aeo-history-${{ github.run_id }}
          restore-keys: |
            open-aeo-history-

      - name: Ask the questions
        if: steps.keys.outputs.ready == 'true'
        run: |
          mkdir -p .open-aeo reports
          cli=.open-aeo-src/dist/index.js
          node "$cli" check --config growth/aeo-queries.yaml --json > reports/check.json
          node "$cli" check --config growth/aeo-queries-branded.yaml --json > reports/branded.json
          node "$cli" sources --domain jlog.ai --json > reports/sources.json
          node growth/aeo-summary.mjs reports/check.json reports/branded.json reports/sources.json >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: steps.keys.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aeo-baseline-${{ github.run_id }}
          path: reports/
          retention-days: 90
