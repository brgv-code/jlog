name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Two branches open at once both pick the next free number (BRG-220).
      - name: Migration prefixes are unique
        run: node packages/db/scripts/migrations.mjs prefixes

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Only a push to main deploys, and only after the checks above pass; pull requests stop at the checks.
  deploy-api:
    name: Deploy API
    needs: lint-typecheck-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-api.yml
    # The deploy's own secrets come from its production environment; this passes the repository ones it names.
    secrets: inherit
